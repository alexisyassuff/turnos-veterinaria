services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${TURNOS_DB_NAME:-turnos_vet}
      MARIADB_ROOT_PASSWORD: ${TURNOS_DB_PASSWORD:-root}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A tasks worker --loglevel=info
    env_file:
      - .env
    environment:
      TURNOS_CELERY_BROKER_URL: sqla+sqlite:////app/broker/celery_broker.db
      TURNOS_DB_HOST: mariadb
    volumes:
      - celery_broker:/app/broker/
    depends_on:
      - mariadb
    restart: unless-stopped

volumes:
  celery_broker:
  mariadb_data:
